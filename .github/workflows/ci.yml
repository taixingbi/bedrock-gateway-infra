name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fmt-validate:
    name: fmt + validate (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [global, dev, prod]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"

      - name: terraform fmt -check
        run: terraform fmt -check -recursive .

      - name: terraform init (no backend, validate only)
        working-directory: environments/${{ matrix.environment }}
        run: terraform init -backend=false -input=false

      - name: terraform validate
        working-directory: environments/${{ matrix.environment }}
        run: terraform validate

  plan:
    name: plan (${{ matrix.environment }})
    needs: fmt-validate
    runs-on: ubuntu-latest
    environment: plan
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_INFRA_PLAN_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"

      - name: terraform init
        working-directory: environments/${{ matrix.environment }}
        run: terraform init -input=false

      - name: terraform plan
        working-directory: environments/${{ matrix.environment }}
        run: terraform plan -input=false -lock=false

  apply-dev:
    name: apply (dev)
    needs: fmt-validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # "apply-dev" has no required reviewers -- dev deploys automatically
    # on every push to main once fmt/validate passes.
    environment: apply-dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_INFRA_APPLY_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"

      - name: terraform init
        working-directory: environments/dev
        run: terraform init -input=false

      - name: terraform apply
        working-directory: environments/dev
        run: terraform apply -input=false -auto-approve

  apply-prod:
    name: apply (prod)
    # Gated on dev succeeding first, but that ordering alone does not
    # grant prod access -- "apply-prod" has its own required reviewers
    # configured on its GitHub Environment, so this job always pauses
    # for a separate manual approval regardless of how dev went.
    # -auto-approve below only skips terraform's own interactive
    # confirmation prompt (which no CI runner could ever answer); it
    # does not skip or replace the Environment's review gate.
    needs: apply-dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: apply-prod
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_INFRA_APPLY_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"

      - name: terraform init
        working-directory: environments/prod
        run: terraform init -input=false

      - name: terraform apply
        working-directory: environments/prod
        run: terraform apply -input=false -auto-approve
